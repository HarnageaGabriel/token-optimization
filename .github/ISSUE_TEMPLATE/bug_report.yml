name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How to get from a clean checkout to the wrong behaviour.
      placeholder: |
        1. ...
        2. ...
        3. observed: ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, shell, runner type, tool versions, whatever is relevant here.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: The lines that matter rather than the whole log. Please redact secrets and tenant identifiers.
      render: shell
